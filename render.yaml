# RentProof on Render — Docker web service + managed Postgres (preferred on diskless free plans).
# Set secrets in the Render dashboard (never commit real keys):
#   DATABASE_URL (from the Postgres service), OPENAI_API_KEY, RESEND_API_KEY,
#   YOOKASSA_SHOP_ID, YOOKASSA_SECRET_KEY, OWNER_EMAIL
#
# Cut over to Postgres only after scripts/migrate-sqlite-to-postgres.mts verifies counts.
# Keep SQLite backups; do not delete source DBs.

databases:
  - name: rentproof-db
    plan: 0.1c-256mb

services:
  - type: web
    name: rentproof
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    # Optional: paid Persistent Disk for uploads / SQLite rollback. Free web has no disk.
    # disk:
    #   name: rentproof-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: rentproof-db
          property: connectionString
      - key: RENTPROOF_DB_DRIVER
        value: postgres
      # Keep 0 for first empty bootstrap (no SQLite backup). Set to 1 after owner registers.
      - key: RENTPROOF_REQUIRE_NONEMPTY_POSTGRES
        value: "0"
      - key: RENTPROOF_DB_PATH
        value: /data/rentproof.sqlite
      - key: RENTPROOF_UPLOAD_DIR
        value: /tmp/rentproof-uploads
      - key: RENTPROOF_COOKIE_SECURE
        value: "1"
      - key: OPENAI_BASE_URL
        value: https://tokenlavka.com/v1
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: NEXT_PUBLIC_SITE_URL
        value: https://rentproof2.onrender.com
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: YANDEX_VERIFICATION
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Mail (Resend). Set secrets in dashboard — never commit keys.
      - key: MAIL_DRIVER
        value: resend
      - key: MAIL_FROM
        value: RentProof <onboarding@resend.dev>
      - key: RESEND_API_KEY
        sync: false
      # RENTPROOF_ADMIN_* deprecated/ignored — OWNER via OWNER_EMAIL only
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_RECOVERY_TOKEN
        sync: false
      - key: RENTPROOF_PAYMENTS_ENABLED
        value: "0"
      - key: RENTPROOF_LISTING_AUTO_PUBLISH
        value: "1"
      - key: RENTPROOF_BILLING_PROVIDER
        value: yookassa
      - key: YOOKASSA_MODE
        value: test
      - key: YOOKASSA_API_URL
        value: https://api.yookassa.ru/v3
      - key: YOOKASSA_RETURN_URL
        value: https://rentproof2.onrender.com/payments/return
      - key: RENTPROOF_PLATFORM_FEE_BPS
        value: "500"
      - key: RENTPROOF_YOOKASSA_FAKE
        value: "0"
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
      - key: YOOKASSA_WEBHOOK_SECRET
        sync: false
