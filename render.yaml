# RentProof on Render — Docker + persistent disk for SQLite/uploads.
# Set secrets in the Render dashboard (never commit real keys):
#   OPENAI_API_KEY, OPENAI_BASE_URL, OPENAI_MODEL,
#   NEXT_PUBLIC_SITE_URL, RENTPROOF_ADMIN_EMAIL, RENTPROOF_ADMIN_PASSWORD,
#   YOOKASSA_SHOP_ID, YOOKASSA_SECRET_KEY (test shop only)

services:
  - type: web
    name: rentproof
    runtime: docker
    plan: starter
    healthCheckPath: /api/ai/connection
    disk:
      name: rentproof-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: RENTPROOF_DB_PATH
        value: /data/rentproof.sqlite
      - key: RENTPROOF_UPLOAD_DIR
        value: /data/uploads
      - key: RENTPROOF_COOKIE_SECURE
        value: "1"
      - key: OPENAI_BASE_URL
        value: https://tokenlavka.com/v1
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: NEXT_PUBLIC_SITE_URL
        value: https://rentproof2.onrender.com
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: YANDEX_VERIFICATION
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RENTPROOF_ADMIN_EMAIL
        sync: false
      - key: RENTPROOF_ADMIN_PASSWORD
        sync: false
      - key: RENTPROOF_PAYMENTS_ENABLED
        value: "0"
      - key: RENTPROOF_LISTING_AUTO_PUBLISH
        value: "1"
      - key: RENTPROOF_BILLING_PROVIDER
        value: yookassa
      - key: YOOKASSA_MODE
        value: test
      - key: YOOKASSA_API_URL
        value: https://api.yookassa.ru/v3
      - key: YOOKASSA_RETURN_URL
        value: https://rentproof2.onrender.com/payments/return
      - key: RENTPROOF_PLATFORM_FEE_BPS
        value: "500"
      - key: RENTPROOF_YOOKASSA_FAKE
        value: "0"
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
      - key: YOOKASSA_WEBHOOK_SECRET
        sync: false
